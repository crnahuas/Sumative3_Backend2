spring.application.name=minimarket
server.port=8081
# Configuración de H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Documentación OpenAPI y Swagger UI
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Usuario inicial para ejecutar las pruebas locales. Puede reemplazarse con variables de entorno.
minimarket.admin.username=${MINIMARKET_ADMIN_USERNAME:admin}
minimarket.admin.password=${MINIMARKET_ADMIN_PASSWORD:admin123}
